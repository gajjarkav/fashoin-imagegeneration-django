{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
        AI Fashion Stylist
        {% endblock %}
    </title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            background:#f5f5f5;
            font-family:Arial,Helvetica,sans-serif;

        }

        nav{

            background:#111;
            color:white;

            padding:20px;

        }

        nav h2{

            max-width:1100px;
            margin:auto;

        }

        main{

            max-width:900px;

            margin:50px auto;

            padding:20px;

        }

        .card{

            background:white;

            padding:40px;

            border-radius:12px;

            box-shadow:0 10px 25px rgba(0,0,0,.08);

        }

        h1{

            margin-bottom:20px;

        }

        p{

            line-height:1.8;

        }

        button{

            padding:12px 25px;

            border:none;

            border-radius:8px;

            background:black;

            color:white;

            cursor:pointer;

            font-size:16px;

        }

        button:hover{

            opacity:.9;

        }

        input[type=file]{

            margin:20px 0;

        }

    </style>

</head>

<body>

<nav>

    <h2>

        AI Fashion Stylist

    </h2>

</nav>

<main>

    {% block content %}
    {% endblock %}

</main>

</body>

</html>
